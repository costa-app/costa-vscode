name: Publish Extension

on:
  push:
    tags:
      - v*
      - pre-v*

jobs:
  publish-extension:
    environment: marketplace
    permissions:
      contents: write

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: costa-app/action-setup@v4

      - name: Set node
        uses: costa-app/setup-node@v3
        with:
          node-version: lts/*
          cache: pnpm

      - name: Derive release metadata from tag
        id: meta
        run: |
          set -euo pipefail

          REF="${GITHUB_REF_NAME}"

          if [[ "$REF" == pre-v* ]]; then
            IS_PRERELEASE="true"
            VERSION="${REF#pre-v}"
          elif [[ "$REF" == v* ]]; then
            IS_PRERELEASE="false"
            VERSION="${REF#v}"
          else
            echo "Tag must start with v or pre-v. Got: $REF"
            exit 1
          fi

          # Must be X.Y.Z for VS Code Marketplace
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be plain SemVer X.Y.Z (no -internal/-rc). Got: $VERSION"
            exit 1
          fi

          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Align package.json version to tag (idempotent)
        run: |
          set -euo pipefail
          WANT="${{ steps.meta.outputs.version }}"
          HAVE="$(node -p "require('./package.json').version")"
          if [[ "$HAVE" == "$WANT" ]]; then
            echo "package.json already at $HAVE; skipping version bump."
          else
            pnpm version --no-git-tag-version --allow-same-version "$WANT"
          fi

      - name: Generate GitHub Release notes
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate .vsix file
        run: pnpm package

      - name: Create/Update GitHub Release and upload VSIX
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"

          if [[ "${{ steps.meta.outputs.is_prerelease }}" == "true" ]]; then
            gh release create "$TAG" --prerelease --title "$TAG" ./*.vsix --clobber || \
            gh release upload "$TAG" ./*.vsix --clobber
          else
            gh release create "$TAG" --title "$TAG" ./*.vsix --clobber || \
            gh release upload "$TAG" ./*.vsix --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect publish tokens
        id: tokens
        run: |
          set -euo pipefail

          HAS_VSCE=false
          HAS_OVSX=false

          if [[ -n "${VSCE_PAT:-}" ]]; then HAS_VSCE=true; fi
          if [[ -n "${OVSX_PAT:-}" ]]; then HAS_OVSX=true; fi

          echo "has_vsce=$HAS_VSCE" >> "$GITHUB_OUTPUT"
          echo "has_ovsx=$HAS_OVSX" >> "$GITHUB_OUTPUT"

          if [[ "$HAS_VSCE" != "true" && "$HAS_OVSX" != "true" ]]; then
            echo "No VSCE_PAT or OVSX_PAT found; will skip marketplace publish."
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish Extension (stable)
        if: steps.meta.outputs.is_prerelease == 'false' && (steps.tokens.outputs.has_vsce == 'true' || steps.tokens.outputs.has_ovsx == 'true')
        run: npx vsxpub --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Extension (pre-release)
        if: steps.meta.outputs.is_prerelease == 'true' && (steps.tokens.outputs.has_vsce == 'true' || steps.tokens.outputs.has_ovsx == 'true')
        run: npx vsxpub --no-dependencies --pre-release
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
